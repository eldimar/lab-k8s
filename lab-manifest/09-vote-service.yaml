---
# type: ClusterIP - o Service nao e mais exposto diretamente (NodePort);
# a exposicao externa agora e feita pelo Ingress (15-ingress.yaml), que
# tambem centraliza TLS. Ver 13/14 para o certificado (cert-manager).
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: voting-app
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: voting-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vote
  ports:
    - port: 80
      targetPort: 80
      name: http
