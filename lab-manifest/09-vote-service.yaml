# type: LoadBalancer - o AWS Cloud Controller Manager provisiona um Network
# Load Balancer automaticamente (gera custo continuo enquanto o Service
# existir). A annotation abaixo pede NLB em vez do Classic ELB legado
# (default do provider in-tree quando nao anotado).
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: voting-app
  labels:
    app.kubernetes.io/name: vote
    app.kubernetes.io/part-of: voting-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: vote
  ports:
    - port: 80
      targetPort: 80
      name: http
