---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: voting-app
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: voting-app
    app.kubernetes.io/component: worker
spec:
  # Multiplas replicas do worker competem para consumir a mesma fila no
  # Redis sem duplicar processamento, mas 1 replica ja e suficiente para o
  # volume de um app interno de votacao.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: voting-app
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          # Tag "latest" pinada por digest (nao ha tags de versao publicadas
          # pelo mantenedor para esta imagem) para builds reprodutiveis.
          image: dockersamples/examplevotingapp_worker:latest@sha256:c8a8571065479c12567e8e440836e543d185c678cd4781a32b100f71e8f39c86
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
          volumeMounts:
            # o runtime .NET (CoreCLR) precisa de /tmp gravavel mesmo com
            # readOnlyRootFilesystem (falha com "Failed to create CoreCLR"
            # sem isso).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
