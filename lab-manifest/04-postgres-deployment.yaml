---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: voting-app
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: voting-app
    app.kubernetes.io/component: database
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "entrypoint oficial do postgres:15-alpine precisa de root para chown/chmod do data dir antes de trocar para o usuario postgres via gosu (testado empiricamente)"
    ignore-check.kube-linter.io/no-read-only-root-fs: "entrypoint precisa escrever no socket dir (/var/run/postgresql) e em arquivos temporarios na raiz (testado empiricamente)"
spec:
  replicas: 1
  # Recreate evita que dois pods tentem montar o mesmo PVC ReadWriteOnce
  # simultaneamente durante um rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: voting-app
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: db
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 20
          # O entrypoint oficial da imagem precisa rodar como root para
          # ajustar dono/permissoes do diretorio de dados e so entao
          # trocar para o usuario postgres via gosu (chown/setuid). Testado
          # empiricamente: runAsNonRoot + readOnlyRootFilesystem quebram o
          # start ("Read-only file system" no socket dir, "Operation not
          # permitted" no chmod do data dir) e "drop: ALL" tambem quebra
          # (Operation not permitted no chown/chmod). Por isso este container
          # roda como root, diferente dos demais do app.
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
