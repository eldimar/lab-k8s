apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: voting-app
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: voting-app
    app.kubernetes.io/component: database
spec:
  replicas: 1
  # Recreate evita que dois pods tentem montar o mesmo PVC ReadWriteOnce
  # simultaneamente durante um rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: voting-app
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: db
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 20
          # O entrypoint oficial da imagem precisa rodar como root para
          # ajustar dono/permissoes do diretorio de dados e so entao
          # trocar para o usuario postgres via gosu (chown/setuid). Um
          # securityContext com "drop: ALL" quebra esse processo de start
          # (Operation not permitted no chown/chmod).
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
