---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: voting-app
spec:
  accessModes:
    - ReadWriteOnce
  # Sem storageClassName: usa a StorageClass default do cluster
  # (kind: "standard"/local-path; EKS real: crie/aponte uma gp3 via
  # aws-ebs-csi-driver).
  resources:
    requests:
      storage: 5Gi
