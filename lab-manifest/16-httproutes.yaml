---
# HTTPRoute de redirecionamento: anexado apenas ao listener "http" (porta 80)
# do Gateway - Gateway API nao tem um equivalente direto da annotation
# ssl-redirect do ingress-nginx, entao o redirect HTTP->HTTPS e uma rota
# explicita com filtro RequestRedirect.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app
      sectionName: http
  hostnames:
    - vote.voting-app.local
    - result.voting-app.local
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Roteamento real: cada HTTPRoute anexado ao listener HTTPS correspondente
# (sectionName), nao ao listener HTTP - por isso nao entra no loop do
# redirect acima.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vote
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app
      sectionName: vote-https
  hostnames:
    - vote.voting-app.local
  rules:
    - backendRefs:
        - name: vote
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: result
  namespace: voting-app
spec:
  parentRefs:
    - name: voting-app
      sectionName: result-https
  hostnames:
    - result.voting-app.local
  rules:
    - backendRefs:
        - name: result
          port: 80
