# StorageClass explicita usando o driver CSI (o addon aws-ebs-csi-driver
# provisionado via Terraform), ja que o EKS nao cria mais um default
# baseado no provisioner in-tree (kubernetes.io/aws-ebs), removido desde
# a migracao para CSI.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
