# Credenciais do Postgres. O worker e o result das imagens
# dockersamples/examplevotingapp_* tem a connection string fixa no codigo
# (Server=db;Username=postgres;Password=postgres), entao usuario/senha e
# nome do Service ("db") nao podem ser alterados sem rebuildar as imagens.
#
# Em um ambiente real, gere a senha fora do git (ex: via um Secret externo/
# External Secrets Operator) em vez de manter em texto no manifesto. Como o
# EKS provisionado ja tem envelope encryption (KMS) para secrets no etcd
# (ver terraform/eks.tf), o valor fica criptografado em repouso no cluster.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: voting-app
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres
